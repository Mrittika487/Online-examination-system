<!DOCTYPE html>
<html>
<head>

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
font-family:Arial;
}

.box{
width:450px;
margin:auto;
margin-top:60px;
padding:40px;
background:white;
border-radius:20px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="box">

<h2 class="text-center mb-4">

Student Registration

</h2>

<form method="post" action="/register">

<div class="mb-3">

<label>Name</label>

<input type="text"
       name="name"
       class="form-control"
       required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email"
       name="email"
       class="form-control"
       required>

</div>

<div class="mb-3">

<label>Password</label>

<input type="password"
       name="password"
       class="form-control"
       required>

</div>

<button class="btn btn-success w-100">

Register

</button>

</form>

</div>

</body>
</html>
