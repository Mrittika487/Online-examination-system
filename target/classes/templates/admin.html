<!DOCTYPE html>
<html>

<head>

<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{

background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;

font-family:Arial;

color:white;

}

.card-box{

background:#1e293b;

padding:30px;

border-radius:20px;

transition:0.3s;

height:100%;

}

.card-box:hover{

transform:translateY(-5px);

background:#334155;

}

.main-title{

font-size:40px;

font-weight:bold;

}

a{

text-decoration:none;

}

</style>

</head>

<body>

<div class="container mt-5">

<h1 class="text-center mb-5 main-title">

⚙ Admin Dashboard

</h1>

<div class="row g-4">

<div class="col-md-4">

<a href="/leaderboard">

<div class="card-box text-center">

<h2>🏆</h2>

<h4>Leaderboard</h4>

<p>View Top Students</p>

</div>

</a>

</div>

<div class="col-md-4">

<a href="/exam">

<div class="card-box text-center">

<h2>📝</h2>

<h4>Exam Page</h4>

<p>Open Examination</p>

</div>

</a>

</div>

<div class="col-md-4">

<a href="/dashboard">

<div class="card-box text-center">

<h2>📊</h2>

<h4>Student Dashboard</h4>

<p>Go To Dashboard</p>

</div>

</a>

</div>

<div class="col-md-4">

<a href="/register">

<div class="card-box text-center">

<h2>👨‍🎓</h2>

<h4>Add Student</h4>

<p>Create Student Account</p>

</div>

</a>

</div>

<div class="col-md-4">

<a href="/logout">

<div class="card-box text-center">

<h2>🚪</h2>

<h4>Logout</h4>

<p>Secure Logout</p>

</div>

</a>

</div>

</div>

</div>

</body>

</html>
