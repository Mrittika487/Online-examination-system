<!DOCTYPE html>
<html>

<head>

<title>Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{

background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop') center/cover fixed;

font-family:Arial;

}

.result-card{

background:rgba(255,255,255,0.95);

padding:40px;

border-radius:20px;

box-shadow:0px 10px 30px rgba(0,0,0,0.3);

}

.pass{

color:green;

font-weight:bold;

}

.fail{

color:red;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="result-card text-center">

<h1 class="mb-4">🎉 Exam Result</h1>

<h3 id="studentName"></h3>

<h4 class="mt-3">

Score:
<span id="score"></span>

/

<span id="total"></span>

</h4>

<h4 class="mt-3">

Percentage:
<span id="percentage"></span>%

</h4>

<h3 id="status" class="mt-4"></h3>

<div class="mt-4">

<a href="/dashboard"
   class="btn btn-primary">

Dashboard

</a>

<a href="/leaderboard"
   class="btn btn-success">

Leaderboard

</a>

<a href="/certificate"
   class="btn btn-warning">

Certificate

</a>

</div>

</div>

</div>

</div>

</div>

<script>

const score =
localStorage.getItem("score");

const total =
localStorage.getItem("total");

const studentName =
localStorage.getItem("studentName");

document.getElementById("studentName")
.innerHTML = studentName;

document.getElementById("score")
.innerHTML = score;

document.getElementById("total")
.innerHTML = total;

const percentage =
((score / total) * 100).toFixed(2);

document.getElementById("percentage")
.innerHTML = percentage;

if(percentage >= 40){

document.getElementById("status")
.innerHTML = "PASS ✅";

document.getElementById("status")
.className = "pass";

}else{

document.getElementById("status")
.innerHTML = "FAIL ❌";

document.getElementById("status")
.className = "fail";

}

</script>

</body>
</html>
