<!DOCTYPE html>
<html>

<head>

    <title>Leaderboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop') center/cover fixed;

            font-family:Arial;

        }

        .main-box{

            background:rgba(255,255,255,0.95);

            border-radius:20px;

            padding:40px;

            margin-top:50px;

            box-shadow:0px 10px 30px rgba(0,0,0,0.3);

        }

        table{

            border-radius:10px;

            overflow:hidden;

        }

        h1{

            font-weight:bold;

        }

        .top{

            background:gold !important;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="main-box">

        <h1 class="text-center mb-4">

            🏆 Student Leaderboard

        </h1>

        <table class="table table-bordered table-hover text-center">

            <thead class="table-dark">

            <tr>

                <th>Rank</th>

                <th>Name</th>

                <th>Email</th>

                <th>Score</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="student, stat : ${students}"

                th:class="${stat.index == 0} ? 'top' : ''">

                <td th:text="${stat.count}"></td>

                <td th:text="${student.name}"></td>

                <td th:text="${student.email}"></td>

                <td th:text="${student.score}"></td>

            </tr>

            </tbody>

        </table>

        <div class="text-center mt-4">

            <a href="/dashboard" class="btn btn-primary">

                Back To Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
