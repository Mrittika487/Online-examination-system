<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{

background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Arial;

}

.card-box{

width:430px;

padding:40px;

border-radius:20px;

background:rgba(255,255,255,0.95);

box-shadow:0px 10px 30px rgba(0,0,0,0.3);

transition:0.4s;

}

.card-box:hover{

transform:translateY(-8px) scale(1.01);

}

.btn:hover{

letter-spacing:1px;

}

.register-link{

text-align:center;

margin-top:20px;

}

.register-link a{

text-decoration:none;

font-weight:bold;

}

.info-box{

background:#f1f5f9;

padding:10px;

border-radius:10px;

font-size:14px;

margin-top:20px;

}

</style>

</head>

<body>

<div class="card-box">

<h2 class="text-center mb-4">

Online Examination System

</h2>

<form method="post"
      action="/login"
      onsubmit="return validateLogin()">

<div class="mb-3">

<label>Email</label>

<input type="email"
       name="username"
       class="form-control"
       placeholder="Enter Email"
       required>

</div>

<div class="mb-3">

<label>Password</label>

<input type="password"
       name="password"
       class="form-control"
       placeholder="Enter Password"
       required>

</div>

<div class="mb-3">

<label>

Captcha:
<span id="captchaText"></span>

</label>

<input type="text"
       id="captchaInput"
       class="form-control"
       placeholder="Enter captcha"
       required>

</div>

<button class="btn btn-primary w-100">

Login

</button>

</form>

<!-- REGISTER BUTTON -->

<div class="register-link">

Don't have an account?

<br><br>

<a href="/register"
   class="btn btn-success w-100">

Create New Account

</a>

</div>

<!-- ADMIN INFO -->

<div class="info-box mt-4">

<b>Demo Login</b><br>

Email:
abc@gmail.com

<br>

Password:
abc123

</div>

</div>

<script>

let captcha = "";

function generateCaptcha(){

captcha =
Math.floor(1000 + Math.random() * 9000).toString();

document.getElementById("captchaText")
.innerHTML = captcha;

}

generateCaptcha();

function validateLogin(){

if(document.getElementById("captchaInput").value !== captcha){

alert("Invalid Captcha");

generateCaptcha();

return false;

}

return true;

}

</script>

</body>

</html>
